<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#020509" />
  <title>J.A.R.V.I.S</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- Animated particle background -->
<canvas id="bgCanvas"></canvas>
<!-- CRT scan-line overlay -->
<div class="scan-overlay"></div>

<div id="app">

  <!-- ── HEADER ───────────────────────────────────────────────── -->
  <header>
    <div class="logo">
      <span class="logo-icon">⬡</span>
      J.A.R.V.I.S
    </div>

    <div class="header-center">
      <div class="time-display" id="timeDisplay">00:00:00</div>
      <div class="status-bar">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-text" id="statusText">INITIALIZING</span>
      </div>
    </div>

    <div class="header-right">
      <div class="ai-badge">GEMINI · AI</div>
    </div>
      <!-- Now Playing bar (shows when music is playing) -->
    <div class="now-playing-bar" id="nowPlayingBar">
      <span class="np-icon">🎵</span>
      <div class="np-info">
        <span class="np-title" id="npTitle">—</span>
        <span class="np-sep">·</span>
        <span class="np-artist" id="npArtist">—</span>
      </div>
      <div class="np-btns">
        <button class="np-btn" id="npPrev"      title="Previous">⏮</button>
        <button class="np-btn" id="npPlayPause" title="Pause">⏸</button>
        <button class="np-btn" id="npNext"      title="Next">⏭</button>
        <button class="np-btn" id="npStop"      title="Stop">⏹</button>
      </div>
      <div class="np-track"><div class="np-progress" id="npProgress"></div></div>
    </div>
</header>

  <!-- ── MAIN LAYOUT ──────────────────────────────────────────── -->
  <div class="main-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <!-- ORB -->
      <div class="orb-section">
        <div class="orb-container" id="orbContainer">
          <div class="orb-ring ring-1"></div>
          <div class="orb-ring ring-2"></div>
          <div class="orb-ring ring-3"></div>
          <button class="orb-core" id="orbBtn" title="Click to speak">
            <div class="orb-glare"></div>
          </button>
        </div>
        <div class="orb-hint" id="orbHint">TAP TO SPEAK</div>
      </div>

      <!-- QUICK ACTIONS -->
      <div class="quick-actions">
        <div class="qa-label">QUICK ACCESS</div>
        <button class="qa-btn" data-app="spotify">
          <span class="qa-icon">🎵</span><span>Spotify</span>
        </button>
        <button class="qa-btn" data-app="whatsapp">
          <span class="qa-icon">💬</span><span>WhatsApp</span>
        </button>
        <button class="qa-btn" data-app="maps">
          <span class="qa-icon">🗺️</span><span>Maps</span>
        </button>
        <button class="qa-btn" data-app="gmail">
          <span class="qa-icon">📧</span><span>Gmail</span>
        </button>
        <button class="qa-btn" data-app="linkedin">
          <span class="qa-icon">💼</span><span>LinkedIn</span>
        </button>
        <button class="qa-btn" data-app="github">
          <span class="qa-icon">💻</span><span>GitHub</span>
        </button>
        <button class="qa-btn" data-app="youtube">
          <span class="qa-icon">📺</span><span>YouTube</span>
        </button>
        <button class="qa-btn" data-english="daily" title="English Practice">
          <span class="qa-icon">🇬🇧</span><span>English</span>
        </button>
        <button class="qa-btn" data-music="index" title="Index Music Folder">
          <span class="qa-icon">🎵</span><span>My Music</span>
        </button>
      </div>

    </aside>

    <!-- CHAT MAIN -->
    <main class="chat-main">

      <!-- Voice waveform (shown while listening) -->
      <div class="waveform-container" id="waveformContainer">
        <div class="waveform" id="waveform"></div>
        <div class="waveform-label">LISTENING...</div>
      </div>

      <!-- Chat log -->
      <div class="chat-log" id="chatLog">
        <div class="welcome-card" id="welcomeCard">
          <div class="welcome-icon">⬡</div>
          <div class="welcome-text" id="welcomeText"></div>
        </div>
      </div>

      <!-- Thinking indicator -->
      <div class="thinking-bar" id="thinkingBar">
        <span class="thinking-label">JARVIS IS PROCESSING</span>
        <div class="thinking-dots">
          <span></span><span></span><span></span>
        </div>
      </div>

      <!-- Input area -->
      <div class="input-area">
        <div class="input-bar">
          <span class="input-prefix">&gt;_</span>
          <input
            type="text"
            id="textInput"
            placeholder="Ask JARVIS anything…"
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
          />
          <button class="act-btn mic-btn" id="micBtn" title="Voice input">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
              <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
              <line x1="12" y1="19" x2="12" y2="23"/>
              <line x1="8" y1="23" x2="16" y2="23"/>
            </svg>
          </button>
          <button class="act-btn send-btn" id="sendBtn" title="Send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
        <div class="input-footer">
          <span>SESSION&nbsp;<span id="sessionDisplay">---</span></span>
          <span id="charCount">0 chars</span>
        </div>  
      </div>

    </main>
  </div>
  <div class="mobile-nav">
    <button class="mob-btn" id="mobOrbBtn" title="Speak">🎤</button>
    <button class="mob-btn" data-app="spotify"   title="Spotify">🎵</button>
    <button class="mob-btn" data-app="whatsapp"  title="WhatsApp">💬</button>
    <button class="mob-btn" data-app="maps"      title="Maps">🗺️</button>
    <button class="mob-btn" data-app="github"    title="GitHub">💻</button>
  </div>

</div><!-- /#app -->

<!-- Toast notification -->
<div class="toast" id="toast"></div>

<!-- Confirm modal -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal-box">
    <div class="modal-title" id="modalTitle">CONFIRM ACTION</div>
    <div class="modal-msg"   id="modalMsg"></div>
    <div class="modal-actions">
      <button class="modal-btn yes" id="modalYes">CONFIRM</button>
      <button class="modal-btn no"  id="modalNo">CANCEL</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.7/jsmediatags.min.js"></script>
<script src="music_player.js"></script>
<script src="personal_data.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
