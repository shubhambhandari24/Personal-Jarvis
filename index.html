<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JARVIS</title>
<style>
  :root {
    --bg: #050810;
    --panel: #0a0f1a;
    --cyan: #22d3ee;
    --cyan-dim: rgba(34, 211, 238, 0.25);
    --text: #e6f6fb;
    --text-dim: #7a8a9a;
    --bubble-user: #131a26;
    --bubble-jarvis-border: rgba(34, 211, 238, 0.5);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
  }
  .logo {
    color: var(--cyan);
    font-weight: 700;
    letter-spacing: 2px;
    font-size: 18px;
  }
  .status-line { font-size: 12px; display: flex; align-items: center; gap: 6px; color: var(--text-dim); }
  .status-line::before {
    content: '';
    width: 8px; height: 8px; border-radius: 50%;
    background: #f87171;
  }
  .status-line.connected::before { background: #34d399; }
  .status-line.error::before { background: #f87171; }

  .orb-section {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 0 8px;
  }
  .orb-wrap {
    width: 140px; height: 140px;
    border-radius: 50%;
    border: 1px solid var(--cyan-dim);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: box-shadow 0.3s ease;
  }
  .orb-wrap .orb {
    width: 100px; height: 100px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #7dd3fc, var(--cyan) 60%, #0891b2 100%);
    box-shadow: 0 0 40px var(--cyan-dim);
  }
  .orb-wrap.listening { box-shadow: 0 0 0 8px var(--cyan-dim); }
  .orb-wrap.thinking .orb { animation: pulse 1s infinite ease-in-out; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  .mic-hint { color: var(--text-dim); font-size: 13px; margin-top: 14px; font-family: monospace; }

  .log {
    flex: 1;
    overflow-y: auto;
    padding: 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .empty-state { text-align: center; color: var(--text-dim); margin-top: 40px; font-size: 13px; }
  .entry { max-width: 70%; display: flex; flex-direction: column; gap: 4px; }
  .entry.user { align-self: flex-end; align-items: flex-end; }
  .entry.assistant { align-self: flex-start; align-items: flex-start; }
  .entry .meta { font-size: 11px; color: var(--text-dim); font-family: monospace; }
  .entry .bubble {
    padding: 10px 16px;
    border-radius: 12px;
    font-size: 15px;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .entry.user .bubble { background: var(--bubble-user); }
  .entry.assistant .bubble { border: 1px solid var(--bubble-jarvis-border); background: rgba(34,211,238,0.05); }

  .input-bar {
    display: flex;
    gap: 10px;
    padding: 16px 24px 24px;
  }
  .input-bar input[type="text"] {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--cyan-dim);
    border-radius: 999px;
    padding: 12px 18px;
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  .icon-btn {
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1px solid var(--cyan-dim);
    background: var(--panel);
    color: var(--cyan);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .icon-btn.active { background: var(--cyan); color: #001018; }
</style>
</head>
<body>

<header>
  <div class="logo">JARVIS</div>
  <div class="status-line" id="statusLine"><span id="statusText">connecting…</span></div>
</header>

<div class="orb-section">
  <div class="orb-wrap" id="orbWrap">
    <button id="orbBtn" style="all:unset;cursor:pointer;width:100%;height:100%;display:flex;align-items:center;justify-content:center;">
      <div class="orb"></div>
    </button>
  </div>
  <div class="mic-hint" id="micHint">tap the orb and speak, or type below</div>
</div>

<div class="log" id="log">
  <div class="empty-state" id="emptyState">Say hello, or ask Jarvis anything.</div>
</div>

<div class="input-bar">
  <input type="text" id="textInput" placeholder="Type a message…" />
  <button class="icon-btn" id="micBtn" title="Speak">🎤</button>
  <button class="icon-btn" id="sendBtn" title="Send">➤</button>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
